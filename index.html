<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero tributario clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Idea: tablero estilo Trello, listas por mes o por estado, tarjetas por obligación de cada cliente. */
:root{
  --board-a:#0b5cad; --board-b:#1c86c9;
  --list:#f1f2f4; --card:#ffffff; --card-hover:#f7f8f9;
  --ink:#172b4d; --muted:#5e6c84; --line:#dcdfe4;
  --accent:#0c66e4; --on-accent:#ffffff;
  --bar:rgba(0,0,0,.28); --bar-ink:#ffffff;
  --ok:#1f845a; --bad:#c9372c; --warn:#f5cd47; --warn-ink:#172b4d; --chip:#091e4214;
  --l-ret:#0c66e4; --l-iva:#e56910; --l-ica:#8270db; --l-sim:#2b9a66; --l-inc:#e34935;
  --shadow:0 1px 1px #091e4240, 0 0 1px #091e424f;
  --font:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board-a:#0d1a2e; --board-b:#143a5c;
    --list:#101214; --card:#22272b; --card-hover:#2c333a;
    --ink:#b6c2cf; --muted:#8c9bab; --line:#38414a;
    --accent:#579dff; --on-accent:#091e42;
    --chip:#a1bdd914; --warn-ink:#172b4d;
    --shadow:0 1px 1px #03040442, 0 0 1px #03040445;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --board-a:#0d1a2e; --board-b:#143a5c;
  --list:#101214; --card:#22272b; --card-hover:#2c333a;
  --ink:#b6c2cf; --muted:#8c9bab; --line:#38414a;
  --accent:#579dff; --on-accent:#091e42;
  --chip:#a1bdd914; --warn-ink:#172b4d;
  --shadow:0 1px 1px #03040442, 0 0 1px #03040445;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(135deg,var(--board-a),var(--board-b));background-color:var(--board-a);display:flex;flex-direction:column;font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;background:var(--bar);color:var(--bar-ink)}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.seg{display:flex;background:rgba(255,255,255,.18);border-radius:6px;padding:2px}
.seg button{border:0;background:transparent;color:#fff;padding:5px 12px;border-radius:5px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:#172b4d}
.search{background:rgba(255,255,255,.18);border:1px solid transparent;border-radius:6px;color:#fff;padding:6px 10px;min-width:170px;font:inherit}
.search::placeholder{color:rgba(255,255,255,.75)}
.search:focus{background:#fff;color:#172b4d;outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid transparent;border-radius:4px;padding:3px 9px;font-weight:600;font-size:12px;color:#fff;cursor:pointer;opacity:.55}
.chip[aria-pressed="true"]{opacity:1;border-color:#fff}
.chip[data-c="ret"]{background:var(--l-ret)} .chip[data-c="iva"]{background:var(--l-iva)}
.chip[data-c="ica"]{background:var(--l-ica)} .chip[data-c="sim"]{background:var(--l-sim)} .chip[data-c="inc"]{background:var(--l-inc)}
.sum{margin-left:auto;font-size:13px;opacity:.95}
.sum b{font-variant-numeric:tabular-nums}

/* tablero */
.board{flex:1;min-height:0;display:flex;align-items:flex-start;gap:12px;padding:14px 16px 18px;overflow-x:auto;overflow-y:hidden}
.list{flex:0 0 300px;max-height:100%;display:flex;flex-direction:column;background:var(--list);border-radius:12px;box-shadow:var(--shadow)}
.list.over{outline:2px dashed var(--accent);outline-offset:-2px}
.lh{padding:12px 14px 8px;display:flex;align-items:baseline;gap:8px}
.lh h2{margin:0;font-size:14px;font-weight:700;flex:1}
.lh small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.prog{height:4px;margin:0 14px 8px;background:var(--chip);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0}
.cards{padding:0 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:24px}
.card{position:relative;background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px 9px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;border:0;width:100%}
.card:hover{background:var(--card-hover)}
.card.dragging{opacity:.45}
.card.done .title{text-decoration:line-through;color:var(--muted)}
.labels{display:flex;flex-wrap:wrap;gap:4px}
.lab{height:8px;width:40px;border-radius:4px}
.lab[data-c="ret"]{background:var(--l-ret)} .lab[data-c="iva"]{background:var(--l-iva)}
.lab[data-c="ica"]{background:var(--l-ica)} .lab[data-c="sim"]{background:var(--l-sim)} .lab[data-c="inc"]{background:var(--l-inc)}
.row1{display:flex;gap:8px;align-items:flex-start}
.tick{flex:0 0 auto;width:16px;height:16px;margin-top:2px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;padding:0;display:grid;place-items:center;opacity:0;transition:opacity .12s}
.card:hover .tick,.card:focus-within .tick,.tick[aria-pressed="true"]{opacity:1}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tick[aria-pressed="true"]::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.title{font-weight:600;line-height:1.3}
.sub{color:var(--muted);font-size:13px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.b{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink);font-variant-numeric:tabular-nums}
.b svg{width:12px;height:12px}
.b.d-ok{background:var(--ok);color:#fff}
.b.d-bad{background:var(--bad);color:#fff}
.b.d-soon{background:var(--warn);color:var(--warn-ink)}
.b.d-none{background:transparent;border:1px dashed var(--bad);color:var(--bad)}
.sync{font-size:12px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff}
.sync.bad{background:var(--bad)}
.sync:empty{display:none}
.msg{color:#fff;padding:20px 8px;max-width:560px;line-height:1.5;font-size:15px}
.btn{border:0;background:var(--accent);color:var(--on-accent);padding:8px 16px;border-radius:6px;font-weight:600;cursor:pointer}
.err{color:var(--bad);min-height:1.2em;margin:0}
.empty{color:var(--muted);font-size:13px;padding:6px 6px 10px;text-align:center}

/* detalle */
.ov{position:fixed;inset:0;background:rgba(9,30,66,.6);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;z-index:5}
.ov.open{display:flex}
.dlg{width:min(560px,100%);background:var(--list);border-radius:12px;box-shadow:0 8px 24px #091e4240;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.dh{display:flex;gap:10px;align-items:flex-start}
.dh h3{margin:0;flex:1;font-size:18px;line-height:1.25;text-wrap:balance}
.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px;border-radius:6px}
.x:hover{background:var(--chip)}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0}
.sel{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.note{background:var(--card);border-radius:8px;padding:10px 12px;color:var(--ink);line-height:1.45}
.hint{color:var(--muted);font-size:12px}
@media (max-width:520px){.list{flex-basis:84vw}.dl{grid-template-columns:1fr}.sum{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>Tablero tributario · nov 2026 a ene 2027</h1>
  <div class="seg" role="group" aria-label="Agrupar tarjetas">
    <button id="v-mes" aria-pressed="true">Por mes</button>
    <button id="v-estado" aria-pressed="false">Por estado</button>
  </div>
  <input id="q" class="search" type="search" placeholder="Buscar cliente u obligación" aria-label="Buscar cliente u obligación">
  <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo de obligación"></div>
  <div class="sum" id="sum"></div>
  <span class="sync" id="sync" role="status" aria-live="polite"></span>
</header>
<main class="board" id="board" aria-label="Tablero"></main>

<div class="ov" id="gate" role="dialog" aria-modal="true" aria-labelledby="g-title">
  <form class="dlg" id="g-form">
    <h3 id="g-title" style="margin:0;font-size:18px">Clave de acceso</h3>
    <div class="note">Escribe la clave que definiste en Code.gs. Se guarda solo en este dispositivo.</div>
    <input class="sel" id="g-key" type="password" autocomplete="off" aria-label="Clave de acceso">
    <p class="err" id="g-msg" role="alert"></p>
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="dlg">
    <div class="dh"><h3 id="d-title"></h3><button class="x" id="d-x" aria-label="Cerrar">×</button></div>
    <div class="labels" id="d-lab"></div>
    <dl class="dl" id="d-dl"></dl>
    <div class="note" id="d-note"></div>
    <div class="hint" id="d-hint"></div>
  </div>
</div>

<script>
/* ===== CONFIGURACIÓN: pega aquí la URL de la aplicación web de Apps Script (termina en /exec) ===== */
const CONFIG = { API_URL: 'PEGA_AQUI_LA_URL_DE_APPS_SCRIPT' };
let CARDS = [];
let emptyMsg = 'Cargando…';
const CATS = {ret:'Retención en la fuente', iva:'IVA', ica:'ICA Barranquilla', sim:'Anticipo SIMPLE', inc:'Consumo (INC)'};
const ESTADOS = ['Pendiente','En proceso','Presentado y pagado'];
const MESES = [['nov','Noviembre 2026'],['dic','Diciembre 2026'],['ene','Enero 2027 (cierre)']];
const MON = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DOW = ['dom','lun','mar','mié','jue','vie','sáb'];
const KT = 'tablero-tributario-clave', KC = 'tablero-tributario-cache-v2', KP = 'tablero-tributario-pendientes-v2';

let view = 'mes', query = '', cats = new Set(Object.keys(CATS));
let states = {};            // id -> estado

const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const st = c => states[c.id] || 'Pendiente';
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const fmt = s => { const d = parse(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtLong = s => { const d = parse(s); return `${DOW[d.getDay()]} ${d.getDate()} de ${MON[d.getMonth()]} de ${d.getFullYear()}`; };
const days = s => Math.round((parse(s) - today()) / 864e5);

const CLOCK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.3 1.4"/></svg>';

function dateBadge(c){
  const b = el('span','b');
  if (!c.fecha){ b.className = 'b d-none'; b.textContent = 'Falta NIT'; return b; }
  const dn = days(c.fecha), done = st(c) === 'Presentado y pagado';
  b.innerHTML = CLOCK; b.append(fmt(c.fecha));
  if (done) b.classList.add('d-ok');
  else if (dn < 0) { b.classList.add('d-bad'); b.append(` · vencida`); }
  else if (dn <= 7) { b.classList.add('d-soon'); b.append(dn === 0 ? ' · hoy' : ` · en ${dn} d`); }
  return b;
}

function visible(c){
  if (!cats.has(c.cat)) return false;
  if (!query) return true;
  const t = (c.cliente+' '+c.oblig+' '+c.periodo+' '+c.form).toLowerCase();
  return query.split(/\s+/).every(w => t.includes(w));
}
const byDate = (a,b) => (a.fecha||'9999') < (b.fecha||'9999') ? -1 : (a.fecha||'9999') > (b.fecha||'9999') ? 1 : a.cliente.localeCompare(b.cliente, 'es');

function cardEl(c){
  const done = st(c) === 'Presentado y pagado';
  const k = el('div','card' + (done ? ' done' : ''));
  k.tabIndex = 0; k.setAttribute('role','button');
  k.setAttribute('aria-label', `${c.cliente}, ${c.oblig}, ${c.fecha ? fmtLong(c.fecha) : 'fecha por definir'}`);
  k.draggable = view === 'estado';
  const labs = el('div','labels'); const lb = el('span','lab'); lb.dataset.c = c.cat; lb.title = CATS[c.cat]; labs.append(lb); k.append(labs);
  const r = el('div','row1');
  const tick = el('button','tick'); tick.type = 'button'; tick.setAttribute('aria-pressed', done);
  tick.setAttribute('aria-label', done ? 'Marcar como pendiente' : 'Marcar como presentada y pagada');
  tick.onclick = e => { e.stopPropagation(); setState(c.id, done ? 'Pendiente' : 'Presentado y pagado'); };
  const tx = el('div'); tx.style.minWidth = 0;
  tx.append(el('div','title',c.cliente), el('div','sub',c.oblig));
  r.append(tick, tx); k.append(r);
  const m = el('div','meta');
  m.append(dateBadge(c));
  m.append(el('span','b', c.form.replace(/^(\d+)$/, 'F.$1')));
  m.append(el('span','b', c.periodo));
  if (c.digito != null) m.append(el('span','b','NIT …'+c.digito));
  if (view === 'estado') m.append(el('span','b', MESES.find(x=>x[0]===c.mes)[1].replace(' (cierre)','')));
  k.append(m);
  k.onclick = () => openDlg(c);
  k.onkeydown = e => { if (e.key === 'Enter' && e.target === k) openDlg(c); };
  k.ondragstart = e => { e.dataTransfer.setData('text/plain', c.id); e.dataTransfer.effectAllowed = 'move'; k.classList.add('dragging'); };
  k.ondragend = () => k.classList.remove('dragging');
  return k;
}

function render(){
  const board = $('#board'); const keep = board.scrollLeft; board.textContent = '';
  if (!CARDS.length){ board.append(el('div','msg',emptyMsg)); summary(); return; }
  const cols = view === 'mes' ? MESES.map(([id,n]) => ({id, n, f: c => c.mes === id}))
                              : ESTADOS.map(n => ({id:n, n, f: c => st(c) === n}));
  for (const col of cols){
    const all = CARDS.filter(col.f), shown = all.filter(visible).sort(byDate);
    const done = all.filter(c => st(c) === 'Presentado y pagado').length;
    const L = el('section','list'); L.setAttribute('aria-label', col.n);
    const h = el('div','lh'); h.append(el('h2','',col.n)); h.append(el('small','', view === 'mes' ? `${done} de ${all.length} listas` : `${all.length}`));
    L.append(h);
    if (view === 'mes'){ const p = el('div','prog'); const i = el('i'); i.style.width = (all.length ? done/all.length*100 : 0) + '%'; p.append(i); L.append(p); }
    const body = el('div','cards');
    if (!shown.length) body.append(el('div','empty', all.length ? 'Ninguna tarjeta coincide con el filtro.' : 'Arrastra aquí una tarjeta.'));
    shown.forEach(c => body.append(cardEl(c)));
    L.append(body);
    if (view === 'estado'){
      L.ondragover = e => { e.preventDefault(); L.classList.add('over'); };
      L.ondragleave = e => { if (!L.contains(e.relatedTarget)) L.classList.remove('over'); };
      L.ondrop = e => { e.preventDefault(); L.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) setState(id, col.id); };
    }
    board.append(L);
  }
  board.scrollLeft = keep;
  summary();
}

function summary(){
  const tot = CARDS.length, done = CARDS.filter(c => st(c) === 'Presentado y pagado').length;
  const next = CARDS.filter(c => c.fecha && st(c) !== 'Presentado y pagado' && days(c.fecha) >= 0).sort(byDate)[0];
  const late = CARDS.filter(c => c.fecha && st(c) !== 'Presentado y pagado' && days(c.fecha) < 0).length;
  const s = $('#sum'); s.textContent = '';
  const b = el('b','',`${done} de ${tot}`); s.append(b, ' presentadas');
  if (late) s.append(' · ', el('b','',`${late} vencidas`));
  if (next) s.append(` · próxima: ${fmt(next.fecha)}, ${next.cliente}`);
}

/* detalle */
let cur = null, lastFocus = null;
function openDlg(c){
  cur = c; lastFocus = document.activeElement;
  $('#d-title').textContent = c.cliente + ' · ' + c.oblig;
  const lab = $('#d-lab'); lab.textContent = ''; const l = el('span','lab'); l.dataset.c = c.cat; lab.append(l, el('span','sub', CATS[c.cat]));
  lab.style.alignItems = 'center'; lab.style.gap = '8px';
  const dl = $('#d-dl'); dl.textContent = '';
  const add = (k, v) => { dl.append(el('dt','',k)); const d = el('dd'); if (v instanceof Node) d.append(v); else d.textContent = v; dl.append(d); };
  add('Fecha límite', c.fecha ? fmtLong(c.fecha) : 'Por definir: escribe la fecha en la hoja Tarjetas de Google Sheets cuando tengas el NIT');
  add('Período', c.periodo);
  add('Formulario', c.form === '2593' || /^\d+$/.test(c.form) ? 'F.' + c.form : c.form);
  add('Régimen', c.regimen);
  add('Último dígito NIT', c.digito != null ? String(c.digito) : 'Sin NIT');
  const sel = el('select','sel'); sel.id = 'd-sel'; sel.setAttribute('aria-label','Estado');
  ESTADOS.forEach(e => { const o = el('option','',e); o.value = e; if (e === st(c)) o.selected = true; sel.append(o); });
  sel.onchange = () => setState(c.id, sel.value);
  add('Estado', sel);
  const n = $('#d-note'); n.textContent = c.nota || c.obligFull; n.style.display = 'block';
  $('#d-hint').textContent = c.nota ? c.obligFull : '';
  $('#ov').classList.add('open'); $('#d-x').focus();
}
function closeDlg(){ $('#ov').classList.remove('open'); cur = null; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
$('#d-x').onclick = closeDlg;
$('#ov').onclick = e => { if (e.target.id === 'ov') closeDlg(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && cur) closeDlg(); });

/* conexión con Apps Script y guardado */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const syncEl = $('#sync');
function setSync(txt, bad){ syncEl.textContent = txt; syncEl.classList.toggle('bad', !!bad); }
const configured = () => CONFIG.API_URL && !/^PEGA_/.test(CONFIG.API_URL);
let pending = LS.get(KP, {}), flushing = false, retryT = null;

async function api(action, extra){
  const body = JSON.stringify(Object.assign({action, token: LS.get(KT, '')}, extra || {}));
  const r = await fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body});
  const j = await r.json();
  if (j && j.error === 'no_autorizado') { const e = new Error('no_autorizado'); e.auth = true; throw e; }
  if (j && j.error === 'configura_clave') throw new Error('Cambia la clave TOKEN en Code.gs y vuelve a implementar.');
  if (!j || j.error) throw new Error(j && j.error ? j.error : 'respuesta_invalida');
  return j;
}

async function flush(){
  if (flushing) return;
  flushing = true; clearTimeout(retryT);
  let sent = false;
  try {
    while (true) {
      const id = Object.keys(pending)[0];
      if (!id) break;
      const estado = pending[id];
      await api('estado', {id, estado});
      if (pending[id] === estado) delete pending[id];
      LS.set(KP, pending); sent = true;
    }
    if (sent) setSync('Guardado');
  } catch(e){
    if (e.auth) askKey('La clave no es correcta.');
    else { setSync('Sin conexión: se guardará al volver', true); retryT = setTimeout(flush, 20000); }
  } finally { flushing = false; }
}

function setState(id, estado){
  states[id] = estado; pending[id] = estado;
  LS.set(KP, pending); LS.set(KC, {tarjetas: CARDS, estados: states});
  render();
  if (cur && cur.id === id) { const s = $('#d-sel'); if (s) s.value = estado; }
  if (configured()) { setSync('Guardando…'); flush(); }
}

async function load(){
  if (!configured()) { emptyMsg = 'Falta configurar la dirección de Apps Script: edita CONFIG.API_URL al inicio de index.html (ver LEEME).'; render(); return; }
  setSync('Cargando…');
  try {
    const j = await api('datos');
    CARDS = j.tarjetas || []; states = Object.assign({}, j.estados || {}, pending);
    LS.set(KC, {tarjetas: CARDS, estados: j.estados || {}});
    if (!CARDS.length) emptyMsg = 'La hoja Tarjetas está vacía.';
    render(); setSync('Sincronizado'); flush();
  } catch(e){
    if (e.auth) { askKey(LS.get(KT, '') ? 'La clave no es correcta.' : ''); return; }
    const c = LS.get(KC, null);
    if (c && c.tarjetas && c.tarjetas.length) { CARDS = c.tarjetas; states = Object.assign({}, c.estados || {}, pending); render(); setSync('Sin conexión: datos guardados en este dispositivo', true); }
    else { emptyMsg = 'No se pudo conectar con Apps Script: ' + (e.message || 'error') + '. Revisa la URL y que la implementación sea para "Cualquier persona".'; render(); setSync(''); }
  }
}

const gate = $('#gate');
function askKey(msg){ $('#g-msg').textContent = msg || ''; gate.classList.add('open'); $('#g-key').value = ''; $('#g-key').focus(); }
$('#g-form').onsubmit = e => { e.preventDefault(); const v = $('#g-key').value.trim(); if (!v) return; LS.set(KT, v); gate.classList.remove('open'); load(); };
window.addEventListener('online', () => { if (configured()) flush(); });

/* controles */
function setView(v){ view = v; $('#v-mes').setAttribute('aria-pressed', v==='mes'); $('#v-estado').setAttribute('aria-pressed', v==='estado'); render(); }
$('#v-mes').onclick = () => setView('mes');
$('#v-estado').onclick = () => setView('estado');
$('#q').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };
const chips = $('#chips');
Object.entries(CATS).forEach(([k, n]) => {
  const b = el('button','chip',n); b.type = 'button'; b.dataset.c = k; b.setAttribute('aria-pressed', 'true');
  b.onclick = () => { if (cats.has(k)) cats.delete(k); else cats.add(k); b.setAttribute('aria-pressed', cats.has(k)); render(); };
  chips.append(b);
});

const cache = LS.get(KC, null);
if (cache && cache.tarjetas && cache.tarjetas.length) { CARDS = cache.tarjetas; states = Object.assign({}, cache.estados || {}, pending); }
render();
load();
</script>
</body>
</html>
